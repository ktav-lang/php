name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # README.md/CHANGELOG.md/docs/CONTRIBUTING.md/docs/SECURITY.md and the
  # docs/ru + docs/zh translations are generated by @ktav-lang/polydoc from
  # the root-docs/ unit trees. This job fails when a committed artifact
  # drifts from its source — which is what a hand-edit of the artifact looks
  # like. Fix the source and re-run the generator; never patch the
  # artifact.
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check

  test:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["7.4", "8.2", "8.3"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, json, mbstring, xdebug
          ini-values: ffi.enable=1, xdebug.mode=off
          coverage: xdebug

      # Provenance (review3 #7, reworked review4): Cargo.lock is
      # generated in CI, NOT committed. Generate it, then pin the
      # published core with a real TOML parse (shell: bash — the matrix
      # includes windows-latest): the ktav [[package]] entry must be
      # exactly one, version 0.8.1, from the crates.io registry, with
      # the published checksum. A local-path override, an unreleased
      # branch or a swapped artifact fails the job here.
      - name: Generate Cargo.lock and verify the published ktav 0.8.1 pin
        shell: bash
        run: |
          set -e
          cargo generate-lockfile
          python3 - <<'PY'
          import sys, tomllib
          with open('Cargo.lock', 'rb') as f:
              data = tomllib.load(f)
          pkgs = [p for p in data.get('package', []) if p.get('name') == 'ktav']
          if len(pkgs) != 1:
              sys.exit('expected exactly one ktav [[package]] entry, found %d' % len(pkgs))
          p = pkgs[0]
          if p.get('version') != '0.8.1':
              sys.exit('ktav version %r != 0.8.1' % p.get('version'))
          if p.get('source') != 'registry+https://github.com/rust-lang/crates.io-index':
              sys.exit('ktav source %r is not the crates.io registry' % p.get('source'))
          if p.get('checksum') != '7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5':
              sys.exit('ktav checksum %r mismatch' % p.get('checksum'))
          print('ktav 0.8.1 provenance verified:', p['source'])
          PY

      - name: Build native library
        run: cargo build --release -p ktav-cabi

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Kahlan
        # xdebug is installed (mode=off, so it doesn't slow specs)
        # purely to satisfy Kahlan's coverage layer probe — `--coverage=0`
        # alone still trips its "no PHPDBG / Xdebug" guard.
        #
        # Runs the FULL suite: native suites AND the pure-backend
        # suites under tests/Pure/ — both backends on every OS/PHP.
        # KTAV_ENABLED_BACKENDS is explicit: native cells REQUIRE the
        # cabi artifact (Corpus::requireNative hard-fails when the
        # backend is enabled but the artifact is missing), pure cells
        # always run. The corpus runners are fail-closed on the pinned
        # spec submodule (required SHA
        # 388982118c0d8f767bf283356ac9c9bb50fdc3f5); `KTAV_SPEC_DIR`
        # overrides the corpus path if ever needed.
        env:
          KTAV_ENABLED_BACKENDS: native,pure
        run: vendor/bin/kahlan --reporter=verbose

  # Pure-backend-only matrix: NO Rust toolchain, NO cargo build, NO
  # native artifact. Proves the pure suites load and pass without the
  # native library. Linux/Windows images ship ffi as a shared extension,
  # removed by ':ffi'; macOS compiles it statically, so there the FFI
  # API being disabled is asserted at runtime instead.
  # KTAV_ENABLED_BACKENDS=pure makes Corpus::backends() define ZERO
  # native cells, and Corpus::requireNative() SKIPs (never fails) only
  # for the not-enabled case — every pure cell must pass.
  # The corpus comes from the pinned spec submodule (recursive checkout
  # below; required SHA 388982118c0d8f767bf283356ac9c9bb50fdc3f5) — a
  # missing corpus FAILS this job, it never skips.
  test-pure:
    name: 'pure (no Rust/native artifact) ${{ matrix.os }} / PHP ${{ matrix.php }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["7.4", "8.2", "8.3"]
        include:
          - os: ubuntu-latest
            extensions: 'json, mbstring, :ffi, xdebug'
            static_ffi: false
          - os: macos-latest
            extensions: 'json, mbstring, xdebug'
            static_ffi: true
          - os: windows-latest
            extensions: 'json, mbstring, :ffi, xdebug'
            static_ffi: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP (native-free)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The colon prefix disables ffi per the setup-php README, but
          # only for SHARED extensions: it works on the Linux/Windows
          # images where ffi is shared. macOS setup-php PHP builds
          # compile ffi STATICALLY, so it cannot be unloaded at all;
          # there ffi.enable=0 (below) makes the FFI API refuse to run,
          # and this pure job has no Rust artifact to load anyway.
          extensions: ${{ matrix.extensions }}
          ini-values: ffi.enable=0, xdebug.mode=off
          coverage: xdebug

      # Linux/Windows: ffi is a shared extension and ':ffi' removed it,
      # so the strict extension-ABSENT assert holds. A found-ffi grep
      # (exit 0) fails; absent ffi (grep exit 1, inside the if
      # condition, exempt from set -e) passes.
      - name: Assert the ffi extension is absent
        if: matrix.static_ffi != true
        shell: bash
        run: |
          set -e
          if php -m | grep -ix ffi; then echo 'ERROR: ffi extension is still enabled'; exit 1; fi

      # macOS: встроенный FFI отключён через INI; проверяем реальный отказ API.
      # Заданный отсутствующий KTAV_LIB_PATH исключает cache/download fallback.
      - name: Assert the ffi API is runtime-disabled
        if: matrix.static_ffi == true
        shell: bash
        run: |
          set -e
          php -r 'if (!extension_loaded("ffi")) { exit(0); } $e = ini_get("ffi.enable"); if (!($e === "0" || $e === "" || $e === false)) { exit(1); } try { FFI::cdef("int x;"); } catch (\Throwable $t) { exit(0); } fwrite(STDERR, "ffi API is usable"); exit(1);'

      # This job has no cargo steps; any native artifact is an accident.
      - name: Assert no native artifact exists
        shell: bash
        run: |
          set -e
          for f in \
            target/release/libktav_cabi.so target/debug/libktav_cabi.so \
            target/release/libktav_cabi.dylib target/debug/libktav_cabi.dylib \
            target/release/ktav_cabi.dll target/debug/ktav_cabi.dll ; do
            test ! -e "$f"
          done

      # composer.json requires only php + ext-json (ext-ffi is a
      # "suggest"), so no platform-req waiver is needed here.
      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Kahlan (pure suites only, zero native cells)
        env:
          KTAV_ENABLED_BACKENDS: pure
          # Отсутствующий файл: native-вызов обязан упасть без скачивания библиотеки.
          KTAV_LIB_PATH: ${{ runner.temp }}/ktav-pure-no-artifact/libktav_cabi.so
        run: vendor/bin/kahlan --spec=tests/Pure --reporter=verbose

  # Packaged-import proof: installs the package into a CI-owned
  # consumer directory through a REAL COPY (path repository with
  # options.symlink=false — not a symlink into the checkout), then
  # imports through the documented public API with the ffi extension
  # actually ABSENT (':ffi' removes the shared extension on Linux):
  # the pure backend must work and the native facade must fail with a
  # CLEAR KtavException naming FFI. This is the
  # packaged/no-native viability gate (brief, correctness acceptance 4).
  test-packaged-pure:
    name: 'packaged pure import (ffi ABSENT, PHP 8.2)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (json only, ffi disabled)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # The colon prefix disables ffi per the setup-php README
          # (shared extensions are disabled by prefixing with ':').
          extensions: json, :ffi
          ini-values: ffi.enable=0
          coverage: none

      # The assert step fails the job if ffi still loads: a found-ffi
      # grep (exit 0) fails; absent ffi (grep exit 1, inside the if
      # condition, exempt from set -e) passes.
      - name: Assert the ffi extension is disabled
        shell: bash
        run: |
          set -e
          if php -m | grep -ix ffi; then echo 'ERROR: ffi extension is still enabled'; exit 1; fi

      - name: Install ktav-lang/ktav into a consumer project (real copy)
        run: |
          set -e
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          printf '%s\n' \
            '{' \
            '  "repositories": [' \
            '    {' \
            '      "type": "path",' \
            "      \"url\": \"$GITHUB_WORKSPACE\"," \
            '      "options": { "symlink": false }' \
            '    }' \
            '  ],' \
            '  "require": { "ktav-lang/ktav": "@dev" }' \
            '}' > composer.json
          composer install --no-interaction --no-progress
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"

      - name: Packaged pure import works; native fails clearly without FFI
        run: |
          set -e
          cd "$CONSUMER"
          # 1) ffi must be ABSENT, not merely disabled — ffi.enable=0
          #    is not absence, and NativeLib resolves via
          #    extension_loaded('ffi') (src/NativeLib.php) before any
          #    ini check (review3 P2). The colon-prefixed :ffi in the
          #    Setup PHP step keeps the extension unloaded; these
          #    assertions hold the precondition.
          #    The pure backend loads and parses through the documented
          #    public import.
          php -d ffi.enable=0 -r "if (extension_loaded('ffi')) { fwrite(STDERR, \"ffi present\"); exit(1); } require 'vendor/autoload.php'; \$v = Ktav\\PureBackend::loads('a: 1'); exit(\$v === ['a' => 1] ? 0 : 1);"
          # 2) the native facade fails CLEARLY without FFI: a
          #    KtavException whose message names FFI (NativeLib: 'PHP
          #    FFI extension is required'). Same absence precondition
          #    before the try/catch.
          php -d ffi.enable=0 -r "if (extension_loaded('ffi')) { fwrite(STDERR, \"ffi present\"); exit(1); } require 'vendor/autoload.php'; try { Ktav\\Ktav::loads('a: 1'); fwrite(STDERR, 'native backend unexpectedly worked without FFI'); exit(1); } catch (Ktav\\KtavException \$e) { exit(strpos(\$e->getMessage(), 'FFI') === false ? 1 : 0); }"

  lint-rust:
    name: rust clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release -p ktav-cabi -- -D warnings

  # Native DEBUG C ABI: empty-input regression. Rust's
  # slice::from_raw_parts requires a non-null, aligned pointer even at
  # len 0 (rust/src/cabi/declare.rs:76,110); release builds HIDE a
  # NULL-with-len-0 violation, debug builds (debug_assertions) abort —
  # so this job builds the cabi WITHOUT --release and runs the empty
  # input regression against the real debug artifact. The artifact gate
  # (test -f) and NativeLoader's KTAV_LIB_PATH handling
  # (src/NativeLoader.php:42-48: env path resolved FIRST, missing file
  # THROWS) mean the job can never silently fall back to a cached or
  # downloaded release binary.
  #
  # Only tests/NativeDebugEmptySpec.php runs here, NOT the corpus
  # suites: Corpus::requireNative() hard-fails when native is enabled
  # but TestPaths::cabiBuilt() is false — and TestPaths::cabi() pins
  # the RELEASE path (target/release/libktav_cabi.so,
  # tests/TestPaths.php:17-27), which a debug-only job deliberately
  # does not have. Pointing the corpus at this job would require
  # weakening that gate, so the debug job stays focused.
  test-native-debug-empty:
    name: "native debug ABI: empty input (ubuntu, PHP 8.2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-empty

      # DEBUG build on purpose (NO --release): debug_assertions is the
      # actual UB detector for NULL-with-len-0.
      - name: Build native library (debug)
        run: cargo build -p ktav-cabi

      # Fail-closed artifact gate: no silent fallback, no download.
      - name: Assert the debug cdylib exists
        shell: bash
        run: |
          set -e
          test -f target/debug/libktav_cabi.so || { echo 'ERROR: target/debug/libktav_cabi.so missing'; exit 1; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Native path REQUIRES ext-ffi — no colon prefix here (unlike
          # the pure-only jobs).
          extensions: json, ffi, mbstring, xdebug
          ini-values: ffi.enable=1, xdebug.mode=off
          # xdebug is installed (mode=off) purely to satisfy Kahlan's
          # coverage layer probe, same as the main test job.
          coverage: xdebug

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Sanity assert PHP int width
        run: |
          php -r 'exit(PHP_INT_SIZE === 8 ? 0 : 1);'

      - name: Empty-input regression against the DEBUG library
        env:
          # NativeLoader resolves this FIRST and throws if the file is
          # missing — the debug artifact is the only library this job
          # can use.
          KTAV_LIB_PATH: ${{ github.workspace }}/target/debug/libktav_cabi.so
        run: vendor/bin/kahlan --spec=tests/NativeDebugEmptySpec.php --reporter=verbose

      - name: Assert the loaded native reports 0.8.1
        env:
          KTAV_LIB_PATH: ${{ github.workspace }}/target/debug/libktav_cabi.so
        run: |
          php -r "require 'vendor/autoload.php'; exit(\\Ktav\\Ktav::nativeVersion() === '0.8.1' ? 0 : 1);"
