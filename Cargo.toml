[workspace]
resolver = "2"
members = ["crates/cabi"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktav-lang/php"
rust-version = "1.71"

[workspace.dependencies]
# Exact pin (review4 P1#3): every build (CI and release) must resolve
# the PUBLISHED 0.8.1 core, coherent with the Cargo.lock provenance
# verification in .github/workflows/ci.yml.
ktav = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
debug = false
overflow-checks = false
incremental = false
panic = "abort"
